---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-service
  namespace: dev_ns
  labels:
    app: spring-petclinic

spec:
  type: LoadBalancer

  selector:
    app: spring-petclinic

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-clinic
  namespace: dev_ns
  labels:
    app: spring-petclinic

spec:
  replicas: 4
  minReadySeconds: 2
  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: spring-petclinic

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: spring-petclinic

    spec:
      terminationGracePeriodSeconds: 30

      containers:
      - name: pet-clinic

        image: asia-south1-docker.pkg.dev/smiling-breaker-503014-t3/spring-petclinic/petclinic:1.0

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "150m"
            memory: "500Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20

        startupProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 30
          periodSeconds: 10

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
